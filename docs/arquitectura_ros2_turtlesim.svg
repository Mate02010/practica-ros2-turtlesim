<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Arquitectura del controlador de TurtleSim con ROS 2</title>
  <desc id="descripcion">Diagrama de teleoperación, servicio de modo, acción de trayectoria, nodo controlador y simulador TurtleSim.</desc>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      .fondo { fill: #f8fafc; }
      .titulo { font: 700 27px Arial, sans-serif; fill: #172554; }
      .subtitulo { font: 16px Arial, sans-serif; fill: #475569; }
      .caja-titulo { font: 700 19px Arial, sans-serif; fill: #172554; }
      .caja-texto { font: 15px Arial, sans-serif; fill: #334155; }
      .etiqueta { font: 700 15px Arial, sans-serif; fill: #1e3a8a; }
      .nota { font: 14px Arial, sans-serif; fill: #475569; }
      .caja { stroke-width: 2; rx: 14; }
      .flecha { fill: none; stroke: #374151; stroke-width: 2.5; marker-end: url(#flecha); }
      .flecha-punteada { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#flecha); }
    </style>
  </defs>

  <rect class="fondo" width="1200" height="720"/>
  <text class="titulo" x="600" y="48" text-anchor="middle">Arquitectura: controlador de TurtleSim con ROS 2</text>
  <text class="subtitulo" x="600" y="76" text-anchor="middle">El controlador decide el modo; TurtleSim muestra y devuelve el estado de la tortuga.</text>

  <rect class="caja" x="55" y="145" width="220" height="112" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="caja-titulo" x="165" y="182" text-anchor="middle">Teleop / teclado</text>
  <text class="caja-texto" x="165" y="211" text-anchor="middle">Solo en modo manual</text>
  <text class="caja-texto" x="165" y="234" text-anchor="middle">nodo externo</text>

  <rect class="caja" x="55" y="395" width="220" height="112" fill="#fef3c7" stroke="#d97706"/>
  <text class="caja-titulo" x="165" y="432" text-anchor="middle">Usuario / terminal</text>
  <text class="caja-texto" x="165" y="461" text-anchor="middle">elige modo o envía</text>
  <text class="caja-texto" x="165" y="484" text-anchor="middle">tres puntos</text>

  <rect class="caja" x="430" y="170" width="340" height="340" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="caja-titulo" x="600" y="210" text-anchor="middle">Nodo turtle_controller</text>
  <text class="caja-texto" x="600" y="242" text-anchor="middle">Archivo principal: turtle_controller.py</text>
  <line x1="470" y1="265" x2="730" y2="265" stroke="#c7d2fe" stroke-width="2"/>
  <text class="caja-texto" x="600" y="300" text-anchor="middle">1. Guarda la posición actual</text>
  <text class="caja-texto" x="600" y="332" text-anchor="middle">2. Cambia entre manual, círculo</text>
  <text class="caja-texto" x="600" y="364" text-anchor="middle">y trayectoria</text>
  <text class="caja-texto" x="600" y="404" text-anchor="middle">3. Publica la velocidad necesaria</text>
  <text class="caja-texto" x="600" y="436" text-anchor="middle">4. Informa el modo actual</text>
  <text class="nota" x="600" y="478" text-anchor="middle">Usa SetMode.srv y FollowTrajectory.action</text>

  <rect class="caja" x="925" y="245" width="220" height="140" fill="#dcfce7" stroke="#16a34a"/>
  <text class="caja-titulo" x="1035" y="285" text-anchor="middle">TurtleSim</text>
  <text class="caja-texto" x="1035" y="315" text-anchor="middle">Simulador gráfico</text>
  <text class="caja-texto" x="1035" y="341" text-anchor="middle">muestra la tortuga</text>
  <text class="caja-texto" x="1035" y="367" text-anchor="middle">y publica su estado</text>

  <!-- En modo manual, teleop publica directamente hacia TurtleSim.
       La ruta pasa por encima del controlador para evitar cruces visuales. -->
  <path class="flecha" d="M275 201 V115 H1035 V245"/>
  <rect x="555" y="89" width="166" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="638" y="108" text-anchor="middle">/turtle1/cmd_vel</text>

  <path class="flecha" d="M770 290 H925"/>
  <rect x="780" y="262" width="126" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="843" y="281" text-anchor="middle">/turtle1/cmd_vel</text>

  <path class="flecha" d="M925 345 H770"/>
  <rect x="790" y="352" width="108" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="844" y="371" text-anchor="middle">/turtle1/pose</text>

  <path class="flecha-punteada" d="M275 432 H430"/>
  <rect x="288" y="399" width="128" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="352" y="418" text-anchor="middle">/set_mode</text>
  <text class="nota" x="353" y="455" text-anchor="middle">servicio</text>

  <path class="flecha-punteada" d="M275 484 H430"/>
  <rect x="278" y="503" width="149" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="352" y="522" text-anchor="middle">/follow_trajectory</text>
  <text class="nota" x="353" y="550" text-anchor="middle">acción: progreso y cancelación</text>

  <!-- Salida usada para consultar el modo actual. -->
  <rect class="caja" x="925" y="535" width="220" height="90" fill="#f3e8ff" stroke="#9333ea"/>
  <text class="caja-titulo" x="1035" y="570" text-anchor="middle">Monitor / terminal</text>
  <text class="caja-texto" x="1035" y="599" text-anchor="middle">ros2 topic echo</text>

  <path class="flecha" d="M600 510 V580 H925"/>
  <rect x="690" y="550" width="131" height="27" rx="5" fill="#ffffff"/>
  <text class="etiqueta" x="755" y="569" text-anchor="middle">/current_mode</text>

  <text class="nota" x="55" y="675">Las flechas continuas son tópicos; las punteadas representan una solicitud puntual (servicio o acción).</text>
</svg>
